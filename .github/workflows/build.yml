name: CI Build

on:
  push:
    branches: ["master"]
    tags: ["*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_RUNTIME: net10.0
  SETUP_DOTNET_VERSION: 10.0.x
  BEAENGINE_TAG: v5.3.0

jobs:
  build-native:
    name: Build ${{ matrix.rid }} artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-14
            library: libBeaEngine.dylib
          - rid: win-x64
            runner: windows-latest
            cmake_arch: x64
            library: BeaEngine.dll
          - rid: win-arm64
            runner: windows-11-arm
            cmake_arch: ARM64
            library: BeaEngine.dll
          - rid: linux-x64
            runner: ubuntu-24.04
            library: libBeaEngine.so
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            library: libBeaEngine.so
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.SETUP_DOTNET_VERSION }}
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish -c Release -f "$DOTNET_RUNTIME" -r "${{ matrix.rid }}" \
            --self-contained true -o "publish-${{ matrix.rid }}" de4dot
          rm -f "publish-${{ matrix.rid }}"/*.pdb "publish-${{ matrix.rid }}"/*.xml
      - name: Build BeaEngine
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$BEAENGINE_TAG" https://github.com/BeaEngine/beaengine.git
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sed -i.bak -E '/[[:space:]]*list[[:space:]]*\(APPEND[[:space:]]+BEA_FLAGS[[:space:]]+\/M/d' beaengine/CMakeLists.txt
            cmake -S beaengine -B build-beaengine -A "${{ matrix.cmake_arch }}" \
              -DoptBUILD_DLL=ON -DoptHAS_OPTIMIZED=ON -DoptHAS_SYMBOLS=OFF \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
            cmake --build build-beaengine --config Release
            native_library=$(find build-beaengine -iname 'BeaEngine*.dll' | head -n 1)
          else
            cmake -S beaengine -B build-beaengine \
              -DoptBUILD_DLL=ON -DoptHAS_OPTIMIZED=ON -DoptHAS_SYMBOLS=OFF \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cmake --build build-beaengine
            native_library=$(find build-beaengine -type f \( -name 'libBeaEngine*.so' -o -name 'libBeaEngine*.dylib' \) | head -n 1)
          fi
          [[ -n "$native_library" ]] || { echo "BeaEngine library not found"; exit 1; }
          cp "$native_library" "publish-${{ matrix.rid }}/${{ matrix.library }}"
          mkdir -p "publish-${{ matrix.rid }}/LICENSES"
          cp beaengine/src/COPYING.txt "publish-${{ matrix.rid }}/LICENSES/LICENSE.BeaEngine.GPL.txt"
          cp beaengine/src/COPYING.LESSER.txt "publish-${{ matrix.rid }}/LICENSES/LICENSE.BeaEngine.LGPL.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: de4dotEx-${{ env.DOTNET_RUNTIME }}-${{ matrix.rid }}
          path: publish-${{ matrix.rid }}

      - name: Create .deb package
        if: matrix.rid == 'linux-x64' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/}"
          mkdir -p deb-root/opt/de4dotEx deb-root/usr/local/bin deb-root/DEBIAN
          cp -r "publish-${{ matrix.rid }}"/* deb-root/opt/de4dotEx/
          ln -s /opt/de4dotEx/de4dot deb-root/usr/local/bin/de4dot
          cat > deb-root/DEBIAN/control <<EOF
          Package: de4dotEx
          Version: $version
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: G DATA Advanced Analytics GmbH <mwa@gdata-adan.de>
          Depends: libicu78 | libicu77 | libicu76 | libicu74 | libicu72 | libicu70 | libicu67 | libicu66
          Description: .NET deobfuscator and unpacker
           de4dot is a .NET deobfuscator and unpacker.
          EOF
          dpkg-deb --build deb-root "de4dotEx-${version}.deb"
      - uses: actions/upload-artifact@v7
        if: matrix.rid == 'linux-x64' && startsWith(github.ref, 'refs/tags/')
        with:
          name: de4dotEx-${{ github.ref_name }}-${{ env.DOTNET_RUNTIME }}-x64-deb
          path: de4dotEx-${{ github.ref_name }}.deb

  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Docker image metadata
        id: docker_meta
        shell: bash
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.docker_meta.outputs.image }}:${{ steps.docker_meta.outputs.version }}
            ${{ steps.docker_meta.outputs.image }}:latest
